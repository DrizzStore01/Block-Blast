name: Unzip
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ -f blokblast-vercel.zip ] || exit 0
          unzip -q blokblast-vercel.zip
          rm blokblast-vercel.zip
          cp -r blokblast/. .
          rm -rf blokblast
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Extract project"
          git push
